name: Metro AMS Prototype APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Verify Flutter installation
      - name: Check Flutter Version
        run: flutter --version

      # Install packages
      - name: Install Dependencies
        run: flutter pub get

      # Build Release APK
      - name: Build APK
        run: flutter build apk --release

      # Rename generated APK
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk Metro-AMS-Prototype-v1.0.0.apk

      # Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metro-AMS-Prototype-v1.0.0
          path: Metro-AMS-Prototype-v1.0.0.apk